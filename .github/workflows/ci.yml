name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Why Ruff? Written in Rust, 10-100x faster than flake8, and bundles
      # pyflakes, pycodestyle, isort, and bugbear into a single high-speed pass.
      - name: Run linter (Ruff)
        run: |
          python -m ruff check src tests scripts

      - name: Run code formatting check (Black)
        run: |
          python -m black --check src tests scripts

      - name: Run test suite with coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
